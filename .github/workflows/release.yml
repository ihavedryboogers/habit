name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          - os: macos-13
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish -c Release -r ${{ matrix.rid }} -o out/${{ matrix.rid }}

      - name: Package
        run: |
          cd out/${{ matrix.rid }}
          zip -j ../../habit-${{ matrix.rid }}.zip habit

      - uses: actions/upload-artifact@v4
        with:
          name: habit-${{ matrix.rid }}
          path: habit-${{ matrix.rid }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/habit-osx-arm64.zip \
            artifacts/habit-osx-x64.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
